(function() {

    var dropdown = document.getElementById('solutions-dropdown');
    var menu = document.getElementById('solutions-menu');
    if (dropdown && menu) {
      dropdown.addEventListener('mouseenter', function() {
        menu.style.opacity = '1';
        menu.style.visibility = 'visible';
        menu.style.transform = 'translateY(0)';
      });
      dropdown.addEventListener('mouseleave', function() {
        menu.style.opacity = '0';
        menu.style.visibility = 'hidden';
        menu.style.transform = 'translateY(10px)';
      });
      var links = menu.querySelectorAll('a');
      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          this.style.color = '#12F6C8';
          this.style.background = 'rgba(18,246,200,0.05)';
        });
        link.addEventListener('mouseleave', function() {
          this.style.color = '#9ca3af';
          this.style.background = 'transparent';
        });
      });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(injectNavbar, 100); });
  } else {
    setTimeout(injectNavbar, 100);
