<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>G3TI | Classified Access Logs - Admin Dashboard</title>
<meta name="description" content="Admin dashboard for managing classified access requests"/>
<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050505;
  color: white;
  min-height: 100vh;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.admin-container {
  max-width: 1600px;
  margin: 0 auto;
  padding: 100px 30px 60px;
}
.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 20px;
}
.admin-title {
  font-size: 2rem;
  font-weight: bold;
  color: #12F6C8;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.admin-subtitle {
  color: #9ca3af;
  font-size: 0.9rem;
  margin-top: 5px;
}
.admin-actions {
  display: flex;
  gap: 10px;
}
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-primary {
  background: linear-gradient(135deg, #12F6C8, #0B85E5);
  color: black;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 20px rgba(18, 246, 200, 0.3);
}
.btn-secondary {
  background: rgba(18, 246, 200, 0.1);
  color: #12F6C8;
  border: 1px solid rgba(18, 246, 200, 0.3);
}
.btn-secondary:hover {
  background: rgba(18, 246, 200, 0.2);
}
.btn-danger {
  background: rgba(239, 68, 68, 0.1);
  color: #ef4444;
  border: 1px solid rgba(239, 68, 68, 0.3);
}
.btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
}
.btn-success {
  background: rgba(34, 197, 94, 0.1);
  color: #22c55e;
  border: 1px solid rgba(34, 197, 94, 0.3);
}
.btn-success:hover {
  background: rgba(34, 197, 94, 0.2);
}
.btn-warning {
  background: rgba(245, 158, 11, 0.1);
  color: #f59e0b;
  border: 1px solid rgba(245, 158, 11, 0.3);
}
.btn-warning:hover {
  background: rgba(245, 158, 11, 0.2);
}

/* Login Form */
.login-container {
  max-width: 400px;
  margin: 150px auto;
  padding: 40px;
  background: rgba(18, 246, 200, 0.03);
  border: 1px solid rgba(18, 246, 200, 0.15);
  border-radius: 12px;
}
.login-title {
  color: #12F6C8;
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 30px;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.login-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(5, 5, 5, 0.8);
  border: 1px solid rgba(18, 246, 200, 0.2);
  border-radius: 8px;
  color: white;
  font-size: 1rem;
  margin-bottom: 15px;
}
.login-input:focus {
  outline: none;
  border-color: #12F6C8;
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #12F6C8, #0B85E5);
  color: black;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.login-error {
  color: #ef4444;
  font-size: 0.85rem;
  text-align: center;
  margin-top: 15px;
  display: none;
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}
.stat-card {
  background: rgba(18, 246, 200, 0.03);
  border: 1px solid rgba(18, 246, 200, 0.15);
  border-radius: 12px;
  padding: 25px;
  text-align: center;
}
.stat-value {
  font-size: 2.5rem;
  font-weight: bold;
  color: #12F6C8;
  margin-bottom: 5px;
}
.stat-label {
  color: #9ca3af;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.stat-card.warning .stat-value { color: #f59e0b; }
.stat-card.danger .stat-value { color: #ef4444; }
.stat-card.success .stat-value { color: #22c55e; }

/* Filters */
.filters-bar {
  display: flex;
  gap: 15px;
  margin-bottom: 25px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-select {
  padding: 10px 15px;
  background: rgba(5, 5, 5, 0.8);
  border: 1px solid rgba(18, 246, 200, 0.2);
  border-radius: 6px;
  color: white;
  font-size: 0.85rem;
  min-width: 150px;
}
.filter-select:focus {
  outline: none;
  border-color: #12F6C8;
}

/* Table */
.table-container {
  background: rgba(18, 246, 200, 0.03);
  border: 1px solid rgba(18, 246, 200, 0.15);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 30px;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th {
  background: rgba(18, 246, 200, 0.1);
  color: #12F6C8;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 15px 12px;
  text-align: left;
  border-bottom: 1px solid rgba(18, 246, 200, 0.2);
}
.data-table td {
  padding: 15px 12px;
  border-bottom: 1px solid rgba(18, 246, 200, 0.1);
  font-size: 0.85rem;
  color: #d1d5db;
}
.data-table tr:hover {
  background: rgba(18, 246, 200, 0.05);
}
.data-table tr:last-child td {
  border-bottom: none;
}

/* Status Badges */
.status-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.status-pending {
  background: rgba(245, 158, 11, 0.2);
  color: #f59e0b;
}
.status-approved {
  background: rgba(34, 197, 94, 0.2);
  color: #22c55e;
}
.status-denied {
  background: rgba(239, 68, 68, 0.2);
  color: #ef4444;
}
.status-info_requested {
  background: rgba(11, 133, 229, 0.2);
  color: #0B85E5;
}

/* Risk Score */
.risk-score {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: bold;
}
.risk-low { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
.risk-medium { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
.risk-high { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

/* Clearance Badge */
.clearance-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: rgba(220, 38, 38, 0.2);
  color: #fca5a5;
}

/* Detail Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show {
  display: flex;
}
.modal-content {
  background: #0a0a0a;
  border: 1px solid rgba(18, 246, 200, 0.3);
  border-radius: 12px;
  max-width: 800px;
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 30px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(18, 246, 200, 0.2);
}
.modal-title {
  color: #12F6C8;
  font-size: 1.25rem;
  font-weight: bold;
}
.modal-close {
  background: none;
  border: none;
  color: #9ca3af;
  font-size: 1.5rem;
  cursor: pointer;
}
.modal-close:hover {
  color: #ef4444;
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 25px;
}
.detail-item {
  background: rgba(18, 246, 200, 0.03);
  border: 1px solid rgba(18, 246, 200, 0.1);
  border-radius: 8px;
  padding: 15px;
}
.detail-label {
  color: #9ca3af;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 5px;
}
.detail-value {
  color: white;
  font-size: 0.95rem;
}
.detail-full {
  grid-column: 1 / -1;
}
.detail-purpose {
  background: rgba(18, 246, 200, 0.03);
  border: 1px solid rgba(18, 246, 200, 0.1);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 25px;
}
.detail-purpose-title {
  color: #12F6C8;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 10px;
}
.detail-purpose-text {
  color: #d1d5db;
  line-height: 1.7;
  white-space: pre-wrap;
}
.modal-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid rgba(18, 246, 200, 0.2);
}
.notes-section {
  margin-top: 20px;
}
.notes-textarea {
  width: 100%;
  min-height: 100px;
  padding: 15px;
  background: rgba(5, 5, 5, 0.8);
  border: 1px solid rgba(18, 246, 200, 0.2);
  border-radius: 8px;
  color: white;
  font-size: 0.9rem;
  resize: vertical;
  margin-top: 10px;
}
.notes-textarea:focus {
  outline: none;
  border-color: #12F6C8;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #9ca3af;
}
.empty-state-icon {
  font-size: 3rem;
  margin-bottom: 15px;
  opacity: 0.5;
}
.empty-state-text {
  font-size: 1rem;
}

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: #12F6C8;
}
.loading-spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(18, 246, 200, 0.2);
  border-top-color: #12F6C8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 768px) {
  .detail-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .data-table { font-size: 0.75rem; }
  .data-table th, .data-table td { padding: 10px 8px; }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="login-container">
  <h1 class="login-title">Admin Access</h1>
  <input type="text" id="admin-username" class="login-input" placeholder="Username"/>
  <input type="password" id="admin-password" class="login-input" placeholder="Password"/>
  <button onclick="adminLogin()" class="login-btn">Authenticate</button>
  <p id="login-error" class="login-error">Invalid credentials</p>
</div>

<!-- Dashboard (hidden until login) -->
<div id="dashboard" style="display: none;">
  <div class="admin-container">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Classified Access Logs</h1>
        <p class="admin-subtitle">Security Vetting Dashboard - G3TI Security Division</p>
      </div>
      <div class="admin-actions">
        <button onclick="exportCSV()" class="btn btn-secondary">Export CSV</button>
        <button onclick="exportPDF()" class="btn btn-secondary">Export PDF</button>
        <button onclick="refreshData()" class="btn btn-primary">Refresh</button>
        <button onclick="logout()" class="btn btn-danger">Logout</button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">-</div>
        <div class="stat-label">Total Requests</div>
      </div>
      <div class="stat-card warning">
        <div class="stat-value" id="stat-pending">-</div>
        <div class="stat-label">Pending Review</div>
      </div>
      <div class="stat-card success">
        <div class="stat-value" id="stat-approved">-</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-value" id="stat-denied">-</div>
        <div class="stat-label">Denied</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-risk">-</div>
        <div class="stat-label">Avg Risk Score</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-value" id="stat-high-risk">-</div>
        <div class="stat-label">High Risk</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <select id="filter-status" class="filter-select" onchange="applyFilters()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="denied">Denied</option>
        <option value="info_requested">Info Requested</option>
      </select>
      <select id="filter-clearance" class="filter-select" onchange="applyFilters()">
        <option value="">All Clearance Levels</option>
        <option value="ts-sci">TS/SCI</option>
        <option value="top-secret">Top Secret</option>
        <option value="secret">Secret</option>
        <option value="confidential">Confidential</option>
        <option value="not-sure">Not Sure</option>
      </select>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Reference ID</th>
            <th>Name</th>
            <th>Agency</th>
            <th>Clearance</th>
            <th>Risk</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="requests-table">
          <tr>
            <td colspan="8" class="loading">
              <div class="loading-spinner"></div>
              <p style="margin-top: 15px;">Loading requests...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detail-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Request Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<script>
const BACKEND_URL = 'https://app-rkwofgbb.fly.dev';
let authToken = null;
let allRequests = [];

// Admin Login
async function adminLogin() {
  const username = document.getElementById('admin-username').value;
  const password = document.getElementById('admin-password').value;
  
  try {
    const response = await fetch(BACKEND_URL + '/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    
    const result = await response.json();
    
    if (response.ok && result.token) {
      authToken = result.token;
      localStorage.setItem('g3ti_admin_token', authToken);
      showDashboard();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  } catch (error) {
    console.error('Login error:', error);
    document.getElementById('login-error').style.display = 'block';
  }
}

function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadStats();
  loadRequests();
}

function logout() {
  authToken = null;
  localStorage.removeItem('g3ti_admin_token');
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

// Check for existing token on load
window.onload = function() {
  const savedToken = localStorage.getItem('g3ti_admin_token');
  if (savedToken) {
    authToken = savedToken;
    showDashboard();
  }
};

// Load Stats
async function loadStats() {
  try {
    const response = await fetch(BACKEND_URL + '/api/admin/classified-requests/stats', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    
    if (response.status === 401) {
      logout();
      return;
    }
    
    const stats = await response.json();
    
    document.getElementById('stat-total').textContent = stats.total || 0;
    document.getElementById('stat-pending').textContent = stats.by_status?.pending || 0;
    document.getElementById('stat-approved').textContent = stats.by_status?.approved || 0;
    document.getElementById('stat-denied').textContent = stats.by_status?.denied || 0;
    document.getElementById('stat-risk').textContent = stats.average_risk_score || 0;
    document.getElementById('stat-high-risk').textContent = stats.high_risk_count || 0;
  } catch (error) {
    console.error('Stats error:', error);
  }
}

// Load Requests
async function loadRequests() {
  const status = document.getElementById('filter-status').value;
  const clearance = document.getElementById('filter-clearance').value;
  
  let url = BACKEND_URL + '/api/admin/classified-requests';
  const params = [];
  if (status) params.push('status=' + status);
  if (clearance) params.push('clearance=' + clearance);
  if (params.length) url += '?' + params.join('&');
  
  try {
    const response = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    
    if (response.status === 401) {
      logout();
      return;
    }
    
    allRequests = await response.json();
    renderTable(allRequests);
  } catch (error) {
    console.error('Load requests error:', error);
    document.getElementById('requests-table').innerHTML = '<tr><td colspan="8" class="empty-state"><div class="empty-state-icon">&#9888;</div><p class="empty-state-text">Error loading requests</p></td></tr>';
  }
}

function renderTable(requests) {
  const tbody = document.getElementById('requests-table');
  
  if (!requests || requests.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><div class="empty-state-icon">&#128196;</div><p class="empty-state-text">No classified access requests found</p></td></tr>';
    return;
  }
  
  tbody.innerHTML = requests.map(req => {
    const riskClass = req.risk_score < 40 ? 'risk-low' : req.risk_score < 70 ? 'risk-medium' : 'risk-high';
    const statusClass = 'status-' + req.status;
    const date = new Date(req.created_at).toLocaleDateString();
    
    return `
      <tr>
        <td style="color: #12F6C8; font-family: monospace;">${req.reference_id}</td>
        <td>${escapeHtml(req.full_name)}</td>
        <td>${escapeHtml(req.agency)}</td>
        <td><span class="clearance-badge">${req.clearance_level.toUpperCase()}</span></td>
        <td><span class="risk-score ${riskClass}">${req.risk_score}</span></td>
        <td><span class="status-badge ${statusClass}">${req.status}</span></td>
        <td>${date}</td>
        <td>
          <button onclick="viewDetail(${req.id})" class="btn btn-secondary" style="padding: 5px 10px; font-size: 0.7rem;">View</button>
        </td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function applyFilters() {
  loadRequests();
}

function refreshData() {
  loadStats();
  loadRequests();
}

// View Detail
async function viewDetail(id) {
  try {
    const response = await fetch(BACKEND_URL + '/api/admin/classified-requests/' + id, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    
    if (response.status === 401) {
      logout();
      return;
    }
    
    const req = await response.json();
    
    const riskClass = req.risk_score < 40 ? 'risk-low' : req.risk_score < 70 ? 'risk-medium' : 'risk-high';
    const statusClass = 'status-' + req.status;
    
    document.getElementById('modal-body').innerHTML = `
      <div class="detail-grid">
        <div class="detail-item">
          <div class="detail-label">Reference ID</div>
          <div class="detail-value" style="color: #12F6C8; font-family: monospace;">${req.reference_id}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Status</div>
          <div class="detail-value"><span class="status-badge ${statusClass}">${req.status}</span></div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Full Name</div>
          <div class="detail-value">${escapeHtml(req.full_name)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Email</div>
          <div class="detail-value" style="color: #12F6C8;">${escapeHtml(req.email)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Agency / Organization</div>
          <div class="detail-value">${escapeHtml(req.agency)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Clearance Level</div>
          <div class="detail-value"><span class="clearance-badge">${req.clearance_level.toUpperCase()}</span></div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Risk Score</div>
          <div class="detail-value"><span class="risk-score ${riskClass}">${req.risk_score}/100</span></div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Submitted</div>
          <div class="detail-value">${new Date(req.created_at).toLocaleString()}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Supervisor Name</div>
          <div class="detail-value">${escapeHtml(req.supervisor_name)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Supervisor Email</div>
          <div class="detail-value">${escapeHtml(req.supervisor_email)}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">IP Address</div>
          <div class="detail-value" style="color: #6b7280;">${req.ip_address || 'Unknown'}</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Location</div>
          <div class="detail-value" style="color: #6b7280;">${req.geolocation || 'Unknown'}</div>
        </div>
      </div>
      
      <div class="detail-purpose">
        <div class="detail-purpose-title">Purpose of Request</div>
        <div class="detail-purpose-text">${escapeHtml(req.purpose)}</div>
      </div>
      
      <div class="notes-section">
        <div class="detail-label">Reviewer Notes</div>
        <textarea id="reviewer-notes" class="notes-textarea" placeholder="Add notes about this request...">${req.reviewer_notes || ''}</textarea>
        <button onclick="saveNotes(${req.id})" class="btn btn-secondary" style="margin-top: 10px;">Save Notes</button>
      </div>
      
      <div class="modal-actions">
        <button onclick="updateStatus(${req.id}, 'approved')" class="btn btn-success">Approve</button>
        <button onclick="updateStatus(${req.id}, 'denied')" class="btn btn-danger">Deny</button>
        <button onclick="updateStatus(${req.id}, 'info_requested')" class="btn btn-warning">Request Info</button>
        <button onclick="closeModal()" class="btn btn-secondary">Close</button>
      </div>
      
      ${req.reviewed_at ? `<p style="color: #6b7280; font-size: 0.75rem; margin-top: 15px;">Last reviewed: ${new Date(req.reviewed_at).toLocaleString()} by ${req.reviewed_by || 'Admin'}</p>` : ''}
    `;
    
    document.getElementById('detail-modal').classList.add('show');
  } catch (error) {
    console.error('View detail error:', error);
    alert('Error loading request details');
  }
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('show');
}

// Update Status
async function updateStatus(id, status) {
  const notes = document.getElementById('reviewer-notes')?.value || '';
  
  try {
    const response = await fetch(BACKEND_URL + '/api/admin/classified-requests/' + id + '/status', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ status, reviewer_notes: notes })
    });
    
    if (response.ok) {
      closeModal();
      refreshData();
      alert('Status updated to: ' + status.toUpperCase());
    } else {
      alert('Error updating status');
    }
  } catch (error) {
    console.error('Update status error:', error);
    alert('Error updating status');
  }
}

// Save Notes
async function saveNotes(id) {
  const notes = document.getElementById('reviewer-notes').value;
  
  try {
    const response = await fetch(BACKEND_URL + '/api/admin/classified-requests/' + id + '/notes', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + authToken
      },
      body: JSON.stringify({ reviewer_notes: notes })
    });
    
    if (response.ok) {
      alert('Notes saved successfully');
    } else {
      alert('Error saving notes');
    }
  } catch (error) {
    console.error('Save notes error:', error);
    alert('Error saving notes');
  }
}

// Export CSV
async function exportCSV() {
  const status = document.getElementById('filter-status').value;
  let url = BACKEND_URL + '/api/admin/classified-requests/export/csv';
  if (status) url += '?status=' + status;
  
  try {
    const response = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    
    const result = await response.json();
    
    // Download CSV
    const blob = new Blob([result.csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = result.filename;
    link.click();
  } catch (error) {
    console.error('Export CSV error:', error);
    alert('Error exporting CSV');
  }
}

// Export PDF (generates from JSON data)
async function exportPDF() {
  const status = document.getElementById('filter-status').value;
  let url = BACKEND_URL + '/api/admin/classified-requests/export/json';
  if (status) url += '?status=' + status;
  
  try {
    const response = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    
    const result = await response.json();
    
    // Generate printable HTML for PDF
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`
      <!DOCTYPE html>
      <html>
      <head>
        <title>G3TI Classified Access Requests Report</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 40px; }
          h1 { color: #12F6C8; border-bottom: 2px solid #12F6C8; padding-bottom: 10px; }
          table { width: 100%; border-collapse: collapse; margin-top: 20px; }
          th { background: #050505; color: #12F6C8; padding: 10px; text-align: left; }
          td { padding: 10px; border-bottom: 1px solid #ddd; }
          .header-info { color: #666; margin-bottom: 20px; }
        </style>
      </head>
      <body>
        <h1>G3TI Classified Access Requests Report</h1>
        <p class="header-info">Generated: ${new Date().toLocaleString()} | Total Records: ${result.total_count}</p>
        <table>
          <thead>
            <tr>
              <th>Reference ID</th>
              <th>Name</th>
              <th>Agency</th>
              <th>Clearance</th>
              <th>Risk</th>
              <th>Status</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody>
            ${result.requests.map(req => `
              <tr>
                <td>${req.reference_id}</td>
                <td>${escapeHtml(req.full_name)}</td>
                <td>${escapeHtml(req.agency)}</td>
                <td>${req.clearance_level.toUpperCase()}</td>
                <td>${req.risk_score}</td>
                <td>${req.status.toUpperCase()}</td>
                <td>${new Date(req.created_at).toLocaleDateString()}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <script>window.print();<\/script>
      </body>
      </html>
    `);
    printWindow.document.close();
  } catch (error) {
    console.error('Export PDF error:', error);
    alert('Error generating PDF');
  }
}

// Close modal on escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Close modal on overlay click
document.getElementById('detail-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
</script>
