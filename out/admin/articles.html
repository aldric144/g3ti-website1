<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G3TI Admin - Article Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #050505;
      color: #D1D5DB;
      min-height: 100vh;
    }
    .login-container, .dashboard-container {
      display: none;
    }
    .login-container.active, .dashboard-container.active {
      display: block;
    }
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-box {
      background: #0A0A0C;
      border: 2px solid #12F6C8;
      border-radius: 12px;
      padding: 3rem;
      max-width: 400px;
      width: 100%;
    }
    .login-box h1 {
      color: #12F6C8;
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    .login-box .subtitle {
      color: #0B85E5;
      text-align: center;
      margin-bottom: 2rem;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      color: #9CA3AF;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #12F6C8;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #12F6C8, #0B85E5);
      color: #050505;
      width: 100%;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(18, 246, 200, 0.3);
    }
    .btn-edit {
      background: linear-gradient(135deg, #0B85E5, #6366f1);
      color: #fff;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }
    .btn-delete {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }
    .btn-view {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }
    .btn-new {
      background: linear-gradient(135deg, #12F6C8, #0B85E5);
      color: #050505;
      padding: 0.75rem 1.5rem;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #EF4444;
      color: #EF4444;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.show {
      display: block;
    }
    /* Dashboard */
    .dashboard-container {
      padding: 2rem;
    }
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #12F6C8;
    }
    .dashboard-header h1 {
      color: #12F6C8;
      font-size: 1.5rem;
    }
    .dashboard-header h1 span {
      color: #0B85E5;
      font-size: 0.875rem;
      display: block;
      margin-top: 0.25rem;
    }
    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .logout-btn {
      background: transparent;
      border: 1px solid #EF4444;
      color: #EF4444;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #0A0A0C;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .stat-card.total { border-color: #12F6C8; }
    .stat-card.published { border-color: #22c55e; }
    .stat-card.drafts { border-color: #eab308; }
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .stat-card.total .stat-value { color: #12F6C8; }
    .stat-card.published .stat-value { color: #22c55e; }
    .stat-card.drafts .stat-value { color: #eab308; }
    .stat-label {
      color: #9CA3AF;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filters input, .filters select {
      padding: 0.75rem 1rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-family: inherit;
    }
    .filters input:focus, .filters select:focus {
      outline: none;
      border-color: #12F6C8;
    }
    .filters input[type="text"] {
      min-width: 250px;
    }
    .articles-table {
      width: 100%;
      border-collapse: collapse;
      background: #0A0A0C;
      border-radius: 12px;
      overflow: hidden;
    }
    .articles-table th, .articles-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #222;
    }
    .articles-table th {
      background: #111;
      color: #12F6C8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .articles-table tr:hover {
      background: rgba(18, 246, 200, 0.05);
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
    }
    .status-published { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .status-draft { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }
    .category-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      background: rgba(11, 133, 229, 0.2);
      color: #0B85E5;
      border: 1px solid #0B85E5;
    }
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #6B7280;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal {
      background: #0A0A0C;
      border: 2px solid #12F6C8;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(18, 246, 200, 0.1), rgba(11, 133, 229, 0.1));
    }
    .modal-header h2 {
      color: #12F6C8;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: #9CA3AF;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 1.5rem;
    }
    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #333;
    }
    .delete-modal .modal {
      border-color: #dc2626;
    }
    .delete-modal .modal-header {
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.2), rgba(245, 158, 11, 0.1));
    }
    .delete-modal .modal-header h2 {
      color: #dc2626;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #12F6C8;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid #333;
      border-top-color: #12F6C8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .article-title {
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .article-title a {
      color: #fff;
      text-decoration: none;
    }
    .article-title a:hover {
      color: #12F6C8;
    }
  </style>
</head>
<body>
  <div id="login-container" class="login-container active">
    <div class="login-box">
      <h1>ARTICLE MANAGEMENT</h1>
      <div class="subtitle">G3TI News & Intelligence CMS</div>
      <div id="login-error" class="error-msg"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Authenticate</button>
      </form>
    </div>
  </div>

  <div id="dashboard-container" class="dashboard-container">
    <div class="dashboard-header">
      <h1>ARTICLE MANAGEMENT<span>News & Intelligence CMS Dashboard</span></h1>
      <div class="header-actions">
        <a href="/news-intelligence/new.html" class="btn btn-new">+ New Article</a>
        <a href="/admin/access-logs.html" style="color: #12F6C8; text-decoration: none; font-size: 0.875rem;">Access Logs</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Articles</div>
      </div>
      <div class="stat-card published">
        <div class="stat-value" id="stat-published">0</div>
        <div class="stat-label">Published</div>
      </div>
      <div class="stat-card drafts">
        <div class="stat-value" id="stat-drafts">0</div>
        <div class="stat-label">Drafts</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="search-input" placeholder="Search articles...">
      <select id="category-filter">
        <option value="">All Categories</option>
        <option value="Government">Government</option>
        <option value="Enterprise">Enterprise</option>
        <option value="AI Security">AI Security</option>
        <option value="National Threats">National Threats</option>
        <option value="Technology">Technology</option>
      </select>
      <select id="status-filter">
        <option value="">All Status</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
      <button class="btn btn-primary" onclick="loadArticles()" style="padding: 0.75rem 1rem;">Refresh</button>
    </div>

    <div id="articles-container">
      <div class="loading">
        <div class="spinner"></div>
        <p style="margin-top: 1rem;">Loading articles...</p>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="delete-modal" class="modal-overlay delete-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1rem;">Are you sure you want to delete this article?</p>
        <p style="color: #f59e0b; font-size: 0.875rem;"><strong id="delete-article-title"></strong></p>
        <p style="color: #6B7280; font-size: 0.75rem; margin-top: 0.5rem;">This action cannot be undone.</p>
        <div class="modal-actions">
          <button class="btn btn-delete" onclick="confirmDelete()">Delete Article</button>
          <button class="btn" style="background: #333; color: #fff;" onclick="closeDeleteModal()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal" style="max-width: 800px;">
      <div class="modal-header">
        <h2>Edit Article</h2>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="edit-form">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="edit-title" required>
          </div>
          <div class="form-group">
            <label>Subtitle</label>
            <input type="text" id="edit-subtitle">
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="edit-category" required>
              <option value="Government">Government</option>
              <option value="Enterprise">Enterprise</option>
              <option value="AI Security">AI Security</option>
              <option value="National Threats">National Threats</option>
              <option value="Technology">Technology</option>
            </select>
          </div>
          <div class="form-group">
            <label>Content</label>
            <textarea id="edit-content" style="width: 100%; min-height: 200px; padding: 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit;" required></textarea>
          </div>
          <div class="form-group">
            <label>Excerpt</label>
            <textarea id="edit-excerpt" style="width: 100%; min-height: 80px; padding: 1rem; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-family: inherit;"></textarea>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="edit-status" required>
              <option value="published">Published</option>
              <option value="draft">Draft</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn" style="background: #333; color: #fff;" onclick="closeEditModal()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://app-rkwofgbb.fly.dev';
    let adminToken = localStorage.getItem('g3ti_admin_token');
    let articles = [];
    let deleteArticleId = null;

    // Check if already logged in
    document.addEventListener('DOMContentLoaded', async () => {
      if (adminToken) {
        try {
          const response = await fetch(`${BACKEND_URL}/api/admin/verify`, {
            headers: { 'Authorization': `Bearer ${adminToken}` }
          });
          if (response.ok) {
            showDashboard();
            return;
          }
        } catch (e) {}
      }
      document.getElementById('login-container').classList.add('active');
    });

    // Login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          adminToken = data.token;
          localStorage.setItem('g3ti_admin_token', adminToken);
          errorEl.classList.remove('show');
          showDashboard();
        } else {
          errorEl.textContent = data.detail || 'Invalid credentials';
          errorEl.classList.add('show');
        }
      } catch (error) {
        errorEl.textContent = 'Connection error. Please try again.';
        errorEl.classList.add('show');
      }
    });

    function showDashboard() {
      document.getElementById('login-container').classList.remove('active');
      document.getElementById('dashboard-container').classList.add('active');
      loadStats();
      loadArticles();
    }

    function logout() {
      localStorage.removeItem('g3ti_admin_token');
      adminToken = null;
      document.getElementById('dashboard-container').classList.remove('active');
      document.getElementById('login-container').classList.add('active');
    }

    async function loadStats() {
      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/articles/stats`, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await response.json();
        
        document.getElementById('stat-total').textContent = data.total || 0;
        document.getElementById('stat-published').textContent = data.published || 0;
        document.getElementById('stat-drafts').textContent = data.drafts || 0;
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function loadArticles() {
      const container = document.getElementById('articles-container');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top: 1rem;">Loading articles...</p></div>';

      const search = document.getElementById('search-input').value;
      const category = document.getElementById('category-filter').value;
      const status = document.getElementById('status-filter').value;

      let url = `${BACKEND_URL}/api/admin/articles?`;
      if (search) url += `search=${encodeURIComponent(search)}&`;
      if (category) url += `category=${encodeURIComponent(category)}&`;
      if (status) url += `status=${encodeURIComponent(status)}&`;

      try {
        const response = await fetch(url, {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await response.json();
        articles = data.articles || [];
        renderArticles();
      } catch (error) {
        container.innerHTML = '<div class="empty-state">Failed to load articles. Please try again.</div>';
      }
    }

    function renderArticles() {
      const container = document.getElementById('articles-container');
      
      if (articles.length === 0) {
        container.innerHTML = '<div class="empty-state">No articles found. <a href="/news-intelligence/new.html" style="color: #12F6C8;">Create your first article</a></div>';
        return;
      }

      let html = `
        <table class="articles-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      articles.forEach(article => {
        const date = article.publish_date || article.created_at?.split('T')[0] || 'N/A';
        const statusClass = article.status === 'published' ? 'status-published' : 'status-draft';
        
        html += `
          <tr>
            <td class="article-title">
              <a href="/news-intelligence/article/${article.slug}.html" target="_blank">${escapeHtml(article.title)}</a>
            </td>
            <td><span class="category-badge">${escapeHtml(article.category)}</span></td>
            <td>${date}</td>
            <td><span class="status-badge ${statusClass}">${article.status}</span></td>
            <td class="actions">
              <button class="btn btn-edit" onclick="openEditModal(${article.id})">Edit</button>
              <button class="btn btn-delete" onclick="openDeleteModal(${article.id}, '${escapeHtml(article.title)}')">Delete</button>
              ${article.status === 'published' ? `<a href="/news-intelligence.html#${article.slug}" target="_blank" class="btn btn-view">View</a>` : ''}
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML.replace(/'/g, "\\'");
    }

    // Delete functionality
    function openDeleteModal(id, title) {
      deleteArticleId = id;
      document.getElementById('delete-article-title').textContent = title;
      document.getElementById('delete-modal').classList.add('show');
    }

    function closeDeleteModal() {
      deleteArticleId = null;
      document.getElementById('delete-modal').classList.remove('show');
    }

    async function confirmDelete() {
      if (!deleteArticleId) return;

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/articles/${deleteArticleId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });

        if (response.ok) {
          closeDeleteModal();
          loadStats();
          loadArticles();
        } else {
          alert('Failed to delete article. Please try again.');
        }
      } catch (error) {
        alert('Connection error. Please try again.');
      }
    }

    // Edit functionality
    async function openEditModal(id) {
      const article = articles.find(a => a.id === id);
      if (!article) return;

      document.getElementById('edit-id').value = article.id;
      document.getElementById('edit-title').value = article.title || '';
      document.getElementById('edit-subtitle').value = article.subtitle || '';
      document.getElementById('edit-category').value = article.category || 'Technology';
      document.getElementById('edit-content').value = article.content || '';
      document.getElementById('edit-excerpt').value = article.excerpt || '';
      document.getElementById('edit-status').value = article.status || 'draft';

      document.getElementById('edit-modal').classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('show');
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('edit-id').value;
      const articleData = {
        title: document.getElementById('edit-title').value,
        subtitle: document.getElementById('edit-subtitle').value || null,
        category: document.getElementById('edit-category').value,
        content: document.getElementById('edit-content').value,
        excerpt: document.getElementById('edit-excerpt').value || null,
        status: document.getElementById('edit-status').value
      };

      try {
        const response = await fetch(`${BACKEND_URL}/api/admin/articles/${id}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${adminToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(articleData)
        });

        if (response.ok) {
          closeEditModal();
          loadStats();
          loadArticles();
        } else {
          const data = await response.json();
          alert(data.detail || 'Failed to update article. Please try again.');
        }
      } catch (error) {
        alert('Connection error. Please try again.');
      }
    });

    // Search on enter
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadArticles();
    });

    // Filter change handlers
    document.getElementById('category-filter').addEventListener('change', loadArticles);
    document.getElementById('status-filter').addEventListener('change', loadArticles);
  </script>
