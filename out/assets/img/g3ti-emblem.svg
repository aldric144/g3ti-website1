<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="emblemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12F6C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B85E5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer hexagon border -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" 
           fill="none" 
           stroke="url(#emblemGradient)" 
           stroke-width="3"
           filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" 
           fill="rgba(2,6,10,0.9)" 
           stroke="#12F6C8" 
           stroke-width="1.5"
           opacity="0.8"/>
  
  <!-- G3 Text -->
  <text x="100" y="95" 
        font-family="'Orbitron', 'Arial Black', sans-serif" 
        font-size="42" 
        font-weight="bold" 
        fill="url(#emblemGradient)" 
        text-anchor="middle"
        filter="url(#glow)">G3</text>
  
  <!-- TI Text -->
  <text x="100" y="130" 
        font-family="'Orbitron', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="600" 
        fill="#12F6C8" 
        text-anchor="middle"
        letter-spacing="8">TI</text>
  
  <!-- Corner accents -->
  <line x1="30" y1="60" x2="50" y2="60" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="60" x2="30" y2="80" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  
  <line x1="170" y1="60" x2="150" y2="60" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="60" x2="170" y2="80" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  
  <line x1="30" y1="140" x2="50" y2="140" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="140" x2="30" y2="120" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  
  <line x1="170" y1="140" x2="150" y2="140" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="140" x2="170" y2="120" stroke="#12F6C8" stroke-width="2" opacity="0.6"/>
  
  <!-- Small circuit dots -->
  <circle cx="45" cy="100" r="3" fill="#12F6C8" opacity="0.5"/>
  <circle cx="155" cy="100" r="3" fill="#12F6C8" opacity="0.5"/>
  <circle cx="100" cy="45" r="3" fill="#12F6C8" opacity="0.5"/>
  <circle cx="100" cy="155" r="3" fill="#12F6C8" opacity="0.5"/>
</svg>
