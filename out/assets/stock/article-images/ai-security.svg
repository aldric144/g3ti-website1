<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#0A0A0C"/>
  <rect width="400" height="250" fill="url(#grid)" opacity="0.1"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B85E5" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B85E5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#12F6C8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect x="50" y="50" width="300" height="150" rx="8" fill="url(#glow)" stroke="#0B85E5" stroke-width="1"/>
  <path d="M200 65 L240 85 L240 125 L200 145 L160 125 L160 85 Z" fill="none" stroke="#12F6C8" stroke-width="2"/>
  <circle cx="200" cy="105" r="15" fill="none" stroke="#0B85E5" stroke-width="2"/>
