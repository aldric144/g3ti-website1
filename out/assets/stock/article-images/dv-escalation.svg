<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <rect width="400" height="250" fill="#0A0A0C"/>
  <rect width="400" height="250" fill="url(#grid)" opacity="0.1"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0B85E5" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#12F6C8;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect x="50" y="50" width="300" height="150" rx="8" fill="url(#glow)" stroke="#9B59B6" stroke-width="1"/>
  <path d="M150 140 L175 100 L200 120 L225 80 L250 90" fill="none" stroke="#9B59B6" stroke-width="2"/>
  <circle cx="250" cy="90" r="8" fill="#FF4444"/>
  <text x="200" y="180" text-anchor="middle" fill="#12F6C8" font-family="monospace" font-size="14">ESCALATION VECTORS</text>
</svg>
